services:
  db:
    image: postgres:14
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6
    ports:
      - "${REDIS_PORT:-6389}:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: sh -c "/entrypoint.sh && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-8084}:8000"

  # Опциональный сервис: поднимается только через
  #   docker compose --profile bot up -d
  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py bot
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
