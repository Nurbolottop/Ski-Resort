{% if page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Страницы">
        {% if page_obj.has_previous %}
            <a class="pagination__item" href="?page={{ page_obj.previous_page_number }}">←</a>
        {% endif %}
        {% for num in page_obj.paginator.page_range %}
            {% if num == page_obj.number %}
                <span class="pagination__item is-active">{{ num }}</span>
            {% else %}
                <a class="pagination__item" href="?page={{ num }}">{{ num }}</a>
            {% endif %}
        {% endfor %}
        {% if page_obj.has_next %}
            <a class="pagination__item" href="?page={{ page_obj.next_page_number }}">→</a>
        {% endif %}
    </nav>
{% endif %}
