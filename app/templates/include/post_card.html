<article class="card">
    <a class="card__media" href="{{ post.get_absolute_url }}">
        {% if post.cover %}<img src="{{ post.cover.url }}" alt="{{ post.title }}" loading="lazy" width="600" height="400">{% endif %}
    </a>
    <div class="card__body">
        <time class="card__meta" datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:'d.m.Y' }}</time>
        <h3 class="card__title"><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
        {% if post.excerpt %}<p class="card__text">{{ post.excerpt|truncatechars:160 }}</p>{% endif %}
    </div>
</article>
