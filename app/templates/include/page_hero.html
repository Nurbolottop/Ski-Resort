{# Шапка внутренней страницы. Параметры: title, eyebrow, text, image, parent_title, parent_url #}
<section class="page-hero{% if image %} page-hero--image{% endif %}"{% if image %} style="background-image: url('{{ image.url }}')"{% endif %}>
    <div class="page-hero__overlay"></div>
    <div class="container page-hero__inner">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a href="{% url 'base:home' %}">Главная</a>
            {% if parent_url %}<span>/</span><a href="{{ parent_url }}">{{ parent_title }}</a>{% endif %}
            <span>/</span><span aria-current="page">{{ title }}</span>
        </nav>
        {% if eyebrow %}<span class="section__eyebrow">{{ eyebrow }}</span>{% endif %}
        <h1 class="page-hero__title">{{ title }}</h1>
        {% if text %}<p class="page-hero__text">{{ text }}</p>{% endif %}
    </div>
</section>
