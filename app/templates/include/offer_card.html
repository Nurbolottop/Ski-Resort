<article class="card">
    <a class="card__media" href="{{ offer.get_absolute_url }}">
        {% if offer.image %}<img src="{{ offer.image.url }}" alt="{{ offer.title }}" loading="lazy" width="600" height="400">{% endif %}
        {% if offer.label %}<span class="card__badge card__badge--accent">{{ offer.label }}</span>{% endif %}
    </a>
    <div class="card__body">
        {% if offer.valid_to %}<p class="card__meta">До {{ offer.valid_to|date:'d.m.Y' }}</p>{% endif %}
        <h3 class="card__title"><a href="{{ offer.get_absolute_url }}">{{ offer.title }}</a></h3>
        {% if offer.short_description %}<p class="card__text">{{ offer.short_description|truncatechars:160 }}</p>{% endif %}
        <div class="card__footer">
            <a class="link-more" href="{{ offer.get_absolute_url }}">Подробнее →</a>
        </div>
    </div>
</article>
