<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: Georgia, serif; color: #f1f4f8; text-align: center;
               background: radial-gradient(ellipse at 70% 20%, rgba(89,188,8,.3), transparent 55%), #081329; }
        h1 { margin: 0; font-size: clamp(40px, 7vw, 72px); font-weight: 500; }
        p { margin: 18px 0 0; font-family: Arial, sans-serif; color: #b3c2d2; }
        a { display: inline-block; margin-top: 30px; padding: 14px 30px; border-radius: 999px; color: #0d2403;
            background: linear-gradient(135deg, #c3f59a, #7ad62a 45%, #4fa807); font-family: Arial, sans-serif;
            font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div>
        <h1>Небольшая метель на сервере</h1>
        <p>Мы уже чиним. Попробуйте обновить страницу через пару минут.</p>
        <a href="/">На главную</a>
    </div>
</body>
</html>
